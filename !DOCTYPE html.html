<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pozisyon Büyüklüğü Hesaplayıcı</title>
  <!-- Google Fonts ile modern font ekleyelim -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
  <!-- html2canvas kütüphanesini dahil edelim -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/0.4.1/html2canvas.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      padding: 0;
      background-color: #f4f4f4;
    }

    .container {
      max-width: 400px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #28a745;
      font-size: 24px;
    }

    label {
      display: block;
      margin-top: 10px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #28a745;
      border: none;
      color: white;
      font-size: 16px;
      margin-top: 20px;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }

    #sonuc {
      margin-top: 20px;
      font-size: 18px;
      text-align: center;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #555;
    }

    .footer h3 {
      margin: 0;
    }

    .footer p {
      margin: 5px 0 0;
    }

    .transaction-name {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    /* Logo Stili */
    .logo {
      font-size: 36px;
      font-family: 'Roboto', sans-serif; /* Modern font */
      color: black;  /* Siyah renk */
      text-align: center;
      font-weight: bold; /* Kalın yapalım */
      margin-bottom: 20px;
    }

    .logo span {
      color: #1d5d2c;
    }

    /* Ekran görüntüsü butonu */
    .screenshot-button {
      background-color: #007bff;
      color: white;
      font-size: 16px;
      padding: 10px;
      border-radius: 4px;
      border: none;
      margin-top: 20px;
      cursor: pointer;
      width: 100%;
    }

    .screenshot-button:hover {
      background-color: #0056b3;
    }

    /* Kasa (P) bölümüne USD eklemek için stil */
    .usd-container {
      position: relative;
      width: 100%;
    }

    .usd-input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .usd-label {
      position: absolute;
      right: 10px;
      top: 10px;
      color: #555;
      font-size: 14px;
      font-weight: normal;
    }

    /* TRY/USD kuru eklemek için stil */
    .currency-rate {
      font-size: 12px;
      color: #555;
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <!-- Başlık Kısmı -->
  <div class="logo">
    YUSUF <span>BÜTÜNER</span>
  </div>

  <!-- Hesaplama Alanı -->
  <div class="container" id="content-to-capture">
    <h2>Pozisyon Büyüklüğü Hesaplayıcı</h2>

    <label for="kripto_hissesi">İşlem Adı (Kripto Hissesi):</label>
    <input type="text" id="kripto_hissesi" class="transaction-name" placeholder="Örn: BTC/USDT">

    <label for="p">Kasa (P):</label>
    <div class="usd-container">
      <input type="number" id="p" class="usd-input" step="0.01" placeholder="Örn: 1000">
      <span class="usd-label">USD</span> <!-- USD bilgisi aynı kutuda -->
      <span id="currency-rate" class="currency-rate"></span> <!-- TRY/USD kuru burada gösterilecek -->
    </div>

    <label for="g">Giriş Noktası (G):</label>
    <input type="number" id="g" step="0.0001" placeholder="Örn: 1.3050">

    <label for="s">Stop Noktası (S):</label>
    <input type="number" id="s" step="0.0001" placeholder="Örn: 1.3000">

    <button onclick="hesapla()">Hesapla</button>

    <div id="sonuc"></div>
  </div>

  <!-- Ekran Görüntüsü Al Butonu -->
  <button class="screenshot-button" onclick="takeScreenshot()">Ekran Görüntüsü Al</button>

  <!-- Geliştirici Bilgisi -->
  <div class="footer">
    <h3>Geliştiren:</h3>
    <p>Yusuf Bütüner</p>
  </div>

  <script>
    // TRY/USD kuru almak için API kullanıyoruz
    async function getExchangeRate() {
      const apiKey = 'API_KEY'; // Burada kendi API key'inizi kullanın
      const url = `https://v6.exchangerate-api.com/v6/${apiKey}/latest/USD`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.result === 'success') {
          const tryRate = data.conversion_rates.TRY;
          document.getElementById('currency-rate').innerText = `(TRY/USD: ${tryRate.toFixed(2)})`;
        } else {
          console.error('API Error: ', data.error);
        }
      } catch (error) {
        console.error('API Request Error: ', error);
      }
    }

    // Sayfa yüklendiğinde TRY/USD kuru bilgisini al
    window.onload = function() {
      getExchangeRate();
    };

    function hesapla() {
      let P = parseFloat(document.getElementById("p").value);
      let G = parseFloat(document.getElementById("g").value);
      let S = parseFloat(document.getElementById("s").value);

      if (isNaN(P) || isNaN(G) || isNaN(S)) {
        document.getElementById("sonuc").innerText = "Lütfen tüm değerleri girin.";
        return;
      }

      let stopMesafesi = Math.abs(G - S);
      if (stopMesafesi === 0) {
        document.getElementById("sonuc").innerText = "Stop mesafesi 0 olamaz!";
        return;
      }

      let pozisyonBuyuklugu = P / stopMesafesi;
      document.getElementById("sonuc").innerText =
        "Pozisyon Büyüklüğü: " + pozisyonBuyuklugu.toFixed(2);
    }

    // Ekran görüntüsü al ve indir
    function takeScreenshot() {
      html2canvas(document.getElementById("content-to-capture")).then(function(canvas) {
        let link = document.createElement('a');
        link.download = 'ekran-goruntusu.png';
        link.href = canvas.toDataURL();
        link.click();
      });
    }
  </script>
</body>
</html>
